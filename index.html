<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Time tracking dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/index.js"></script>
</head>

<body>
  <main class="main__container">
    <section class="cards__container">
      <article class="card__head">
        <div class="author">
          <div class="author__picture">
            <img src="./images/image-jeremy.png" alt="profile person named jeremy" class="author__img">
          </div>
          <div class="author__data">
            <p class="description-font">Report for</p>
            <h1 class="author__title">Jeremy Robson</h1>
          </div>
        </div>
        <div class="author__lapse">
          <p class="lapse">Daily</p>
          <p class="lapse">Weekly</p>
          <p class="lapse">Monthly</p>
        </div>
      </article>
      <article class="cards__detail"></article>
    </section>
  </main>
</body>

</html>
